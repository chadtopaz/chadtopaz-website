<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Chad M. Topaz</title>
<style>
  :root {
    --yellow: #F5C842;
    --black: #0D0D0D;
    --mid: #6B6860;
    --rule: #E0DDD6;
    --bg: #FAFAF8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--black);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card { max-width: 30rem; }
  .bar {
    width: 3rem;
    height: 4px;
    background: var(--yellow);
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  p {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--mid);
  }
  @media (max-width: 640px) {
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <h1>Chad M. Topaz</h1>
    <p>Site under construction. Back soon.</p>
  </div>
</body>
</html>
